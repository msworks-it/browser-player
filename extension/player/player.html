<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser Player</title>
    <link rel="stylesheet" href="player.css" />
    <script type="module" src="player.js"></script>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z" fill="currentColor" /></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor" /><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor" /></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M17 6.2v11.6a.8.8 0 0 1-1.25.66L8.4 13.3a1.6 1.6 0 0 1 0-2.6l7.35-5.16A.8.8 0 0 1 17 6.2Z" fill="currentColor" /><rect x="5" y="5.5" width="2.2" height="13" rx="1.1" fill="currentColor" /></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M7 6.2v11.6a.8.8 0 0 0 1.25.66l7.35-5.16a1.6 1.6 0 0 0 0-2.6L8.25 5.54A.8.8 0 0 0 7 6.2Z" fill="currentColor" /><rect x="16.8" y="5.5" width="2.2" height="13" rx="1.1" fill="currentColor" /></symbol>
      <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5v5a1 1 0 0 0 1 1h3l4.3 3.6a.8.8 0 0 0 1.3-.6V5.5a.8.8 0 0 0-1.3-.6L8 8.5H5a1 1 0 0 0-1 1Z" fill="currentColor" /><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5a1 1 0 0 0 1 1h3l4.3 3.6a.8.8 0 0 0 1.3-.6V5.5a.8.8 0 0 0-1.3-.6L8 8.5H5a1 1 0 0 0-1 1Z" fill="currentColor" /><path d="m17 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><rect x="3.5" y="4" width="7.5" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8" /><rect x="13" y="4" width="7.5" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8" /><rect x="3.5" y="13" width="7.5" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8" /><rect x="13" y="13" width="7.5" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8" /></symbol>
      <symbol id="i-voice" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></symbol>
      <symbol id="i-pip" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" /><rect x="12" y="12" width="7" height="5" rx="1" fill="currentColor" /></symbol>
      <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9m6 0h3.5A1.5 1.5 0 0 1 20 5.5V9m0 6v3.5a1.5 1.5 0 0 1-1.5 1.5H15m-6 0H5.5A1.5 1.5 0 0 1 4 18.5V15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.7" fill="currentColor" /><circle cx="12" cy="12" r="1.7" fill="currentColor" /><circle cx="12" cy="18.5" r="1.7" fill="currentColor" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></symbol>
      <symbol id="i-skip" viewBox="0 0 24 24"><path d="M4 7v10l7-5-7-5Zm8 0v10l7-5-7-5Z" fill="currentColor" /></symbol>
    </svg>

    <div id="app" class="app" data-state="loading">
      <video id="video" playsinline preload="metadata"></video>
      <audio id="dub" preload="auto"></audio>
      <iframe id="fallback" hidden allow="autoplay; fullscreen" allowfullscreen></iframe>

      <div class="spinner" id="spinner" aria-hidden="true"></div>
      <div class="message" id="message" hidden></div>
      <div class="osd" id="osd" aria-live="polite"></div>

      <div class="next-card" id="nextCard" hidden>
        <span class="next-label">Prossimo episodio</span>
        <strong id="nextTitle"></strong>
        <div class="next-actions">
          <button type="button" class="btn ghost" id="nextCancel">Annulla</button>
          <button type="button" class="btn primary" id="nextNow">Guarda ora <span id="nextCount"></span></button>
        </div>
      </div>

      <header class="top">
        <div class="titles">
          <span class="series" id="series"></span>
          <strong class="episode" id="epTitle"></strong>
        </div>
        <span class="badge" id="dubBadge" hidden>Doppiato</span>
      </header>

      <div class="controls" id="controls">
        <div class="seek" id="seek">
          <div class="seek-track">
            <div class="seek-buffer" id="seekBuffer"></div>
            <div class="seek-dub" id="seekDub" hidden></div>
            <div class="seek-fill" id="seekFill"></div>
          </div>
          <div class="seek-thumb" id="seekThumb"></div>
          <div class="seek-tip" id="seekTip">0:00</div>
        </div>
        <div class="bar">
          <div class="group">
            <button type="button" class="icon" id="btnPrev" title="Episodio precedente (P)"><svg><use href="#i-prev" /></svg></button>
            <button type="button" class="icon big" id="btnPlay" title="Riproduci (Spazio)"><svg><use href="#i-play" /></svg></button>
            <button type="button" class="icon" id="btnNext" title="Episodio successivo (N)"><svg><use href="#i-next" /></svg></button>
            <div class="volume">
              <button type="button" class="icon" id="btnMute" title="Muto (M)"><svg><use href="#i-vol" /></svg></button>
              <input type="range" id="volume" min="0" max="1" step="0.02" value="1" aria-label="Volume" />
            </div>
            <span class="time"><span id="tCur">0:00</span> / <span id="tDur">0:00</span></span>
          </div>
          <div class="group">
            <button type="button" class="pill" id="btnSkip" title="Salta la sigla (S)"><svg><use href="#i-skip" /></svg><span id="skipLabel">+85s</span></button>
            <button type="button" class="pill" id="btnRate" title="Velocità">1×</button>
            <button type="button" class="icon" id="btnDub" title="Doppiaggio (D)"><svg><use href="#i-voice" /></svg></button>
            <button type="button" class="icon" id="btnEpisodes" title="Episodi (E)"><svg><use href="#i-list" /></svg></button>
            <button type="button" class="icon" id="btnPip" title="Picture in picture"><svg><use href="#i-pip" /></svg></button>
            <button type="button" class="icon" id="btnFull" title="Schermo intero (F)"><svg><use href="#i-full" /></svg></button>
            <button type="button" class="icon" id="btnMore" title="Altro"><svg><use href="#i-more" /></svg></button>
          </div>
        </div>
      </div>

      <div class="menu" id="rateMenu" hidden></div>
      <div class="menu" id="moreMenu" hidden>
        <button type="button" data-action="autonext"><span>Episodio successivo automatico</span><span class="check" id="autoNextCheck"></span></button>
        <button type="button" data-action="settings"><span>Impostazioni</span></button>
        <button type="button" data-action="original"><span>Torna al player del sito</span></button>
      </div>

      <aside class="panel" id="episodesPanel" hidden>
        <div class="panel-head">
          <strong>Episodi</strong>
          <button type="button" class="icon" data-close title="Chiudi"><svg><use href="#i-close" /></svg></button>
        </div>
        <div class="episodes" id="episodes"></div>
      </aside>

      <aside class="panel" id="dubPanel" hidden>
        <div class="panel-head">
          <strong>Doppiaggio ElevenLabs</strong>
          <button type="button" class="icon" data-close title="Chiudi"><svg><use href="#i-close" /></svg></button>
        </div>
        <div class="dub-body">
          <p class="hint" id="dubKeyHint" hidden>
            Manca la chiave ElevenLabs. <button type="button" class="link" id="dubOpenSettings">Aggiungila nelle impostazioni</button>
          </p>

          <section class="dub-current" id="dubCurrent" hidden>
            <div class="dub-status" id="dubStatus"></div>
            <label class="switch"><input type="checkbox" id="dubToggle" /><span>Ascolta il doppiaggio</span></label>
            <button type="button" class="btn ghost small" id="dubDelete">Elimina doppiaggio</button>
          </section>

          <section class="dub-new" id="dubNew">
            <div class="field-row">
              <label>Da<select id="dubSource"></select></label>
              <label>A<select id="dubTarget"></select></label>
            </div>
            <fieldset class="choice">
              <legend>Quanto doppiare</legend>
              <label><input type="radio" name="dubRange" value="test" checked /> <span id="dubTestLabel">2 minuti da qui</span></label>
              <label><input type="radio" name="dubRange" value="full" /> Episodio intero</label>
            </fieldset>
            <button type="button" class="btn primary" id="dubStart">Doppia</button>
            <p class="hint">Il doppiaggio consuma crediti ElevenLabs a minuto di audio. Per le prove conviene il tratto breve.</p>
          </section>
          <p class="error" id="dubError" hidden></p>
        </div>
      </aside>
    </div>
  </body>
</html>
