<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Banco di prova · Browser Player</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #e9ecf2;
        font: 13px/1.4 system-ui, sans-serif;
      }
      .box {
        width: min(960px, 100%);
        aspect-ratio: 16 / 9;
        background: #000;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      pre {
        max-height: 200px;
        overflow: auto;
        background: #fff;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <p>Fa la parte del bridge e dell'adapter AnimeWorld. Sorgente: <code id="src"></code></p>
    <div class="box"><iframe id="player" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
    <pre id="log"></pre>
    <script>
      const pagina =
        new URLSearchParams(location.search).get("url") ??
        "https://www.animeworld.ac/play/the-exiled-heavy-knight-knows-how-to-game-the-system.3eEys/yYTF2DLX9C";
      document.getElementById("src").textContent = pagina;
      const frame = document.getElementById("player");
      frame.src = `/player/player.html?origin=${encodeURIComponent(location.origin)}`;
      const log = (s) => (document.getElementById("log").textContent += s + "\n");
      const send = (m) => frame.contentWindow.postMessage(m, location.origin);

      addEventListener("message", async (e) => {
        if (e.source !== frame.contentWindow) return;
        const m = e.data;
        log("← " + JSON.stringify(m));
        if (m.type === "bp:ready") {
          const s = await (await fetch(`/dev/api/series?url=${encodeURIComponent(pagina)}`)).json();
          send({ type: "bp:init", site: "animeworld", ...s });
          log(`→ init ${s.episodes.length} episodi`);
        }
        if (m.type === "bp:resolve") {
          const r = await fetch(`/dev/api/resolve?url=${encodeURIComponent(pagina)}&id=${m.episodeId}`);
          const body = await r.json();
          send(r.ok ? { type: "bp:resolved", reqId: m.reqId, ok: true, ...body } : { type: "bp:resolved", reqId: m.reqId, ok: false, error: body.error });
          log("→ resolved " + JSON.stringify(body).slice(0, 140));
        }
      });
    </script>
  </body>
</html>
